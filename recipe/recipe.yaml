schema_version: 1

context:
  name: opentelemetry-instrumentation-bedrock
  version: "0.63.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_bedrock-${{ version }}.tar.gz
  sha256: d7209ee3ff63f710a0c914467bc63c35dae68ecee938b0fe16f979d70205e570

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
    - anthropic >=0.17.0
    - tokenizers >=0.13.0
  run_constraints:
    - boto3 >=1.34.120,<2.0.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - boto3
    script:
      - python -c "import opentelemetry.instrumentation.bedrock"
      - python -m pip check

about:
  summary: OpenTelemetry Bedrock instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
